<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fénix · Connect account</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8f7f3;
        color: #252a2f;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 32rem;
        padding: 2rem;
      }
      h1 {
        font:
          38px Georgia,
          serif;
      }
      a {
        color: #bb4e32;
      }
      .pulse {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #bb4e32;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
          transform: scale(0.8);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fénix</h1>
      <span class="pulse" aria-hidden="true"></span>
      <p id="status" role="status">
        Connecting your account · Conectando tu cuenta…
      </p>
      <a href="/integrations"
        >Return to Integrations · Volver a Integraciones</a
      >
      <noscript
        >JavaScript is required to complete this connection. / Activa JavaScript
        para completar la conexión.</noscript
      >
    </main>
    <script nonce="{{nonce}}">
      (async () => {
        const query = new URLSearchParams(location.search);
        const input = {
          state: query.get("state"),
          code: query.get("code"),
          error: query.get("error"),
        };
        history.replaceState(null, "", location.pathname);
        const spanish = navigator.language.startsWith("es");
        const status = document.getElementById("status");
        try {
          if (!input.error && (!input.state || !input.code))
            throw Error(
              spanish
                ? "Vuelve a iniciar la conexión desde Integraciones."
                : "Start the connection again from Integrations.",
            );
          const response = await fetch("/api/connectors/oauth/callback", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(input),
          });
          if (response.status === 401)
            throw Error(
              spanish
                ? "Inicia sesión y vuelve a conectar tu cuenta."
                : "Sign in and reconnect your account.",
            );
          const result = await response.json();
          if (!response.ok)
            throw Error(
              result.error ||
                (spanish
                  ? "No se pudo conectar la cuenta."
                  : "Could not connect the account."),
            );
          const destination = new URL(result.redirect, location.origin);
          if (
            destination.origin !== location.origin ||
            destination.pathname !== "/integrations"
          )
            throw Error("Invalid connection response");
          location.replace(destination.href);
        } catch (error) {
          status.textContent =
            error instanceof Error ? error.message : String(error);
          document.querySelector(".pulse").hidden = true;
        }
      })();
    </script>
  </body>
</html>
