name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - name: Install and build frontend
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web build
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check public installer contracts
        run: |
          bash -n scripts/install.sh scripts/package-release.sh
          python3 -m unittest discover -s tests/installer -v
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check compiler lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit and HTTP integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Check documentation examples
        run: cargo test --workspace --doc --locked
      - name: Check PDF extraction and OCR routing contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/fenix-pdf-tests"
          "$RUNNER_TEMP/fenix-pdf-tests/bin/pip" install -r resources/skills/pdf-workflows/scripts/requirements.txt
          "$RUNNER_TEMP/fenix-pdf-tests/bin/python" -m unittest discover -s tests/ocr -p test_worker.py -v
          "$RUNNER_TEMP/fenix-pdf-tests/bin/python" -m unittest discover -s tests/pdf -v
      - name: Build the local application
        run: cargo build --locked -p fenix-server
      - name: Check YouTube caption contracts offline
        run: |
          python3 -m venv "$RUNNER_TEMP/fenix-youtube-tests"
          "$RUNNER_TEMP/fenix-youtube-tests/bin/pip" install -r resources/skills/youtube-summary/scripts/requirements.txt
          "$RUNNER_TEMP/fenix-youtube-tests/bin/python" -m unittest discover -s tests/youtube -v
      - name: Check frontend source
        working-directory: apps/web
        run: |
          pnpm run check
          pnpm run format:check
      - name: Install the test browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: apps/web
        run: pnpm test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - name: Install and build documentation
        run: |
          pnpm --dir apps/docs install --frozen-lockfile
          pnpm --dir apps/docs build

  native-process-engine:
    name: Native files, skills, storage and processes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Test real files, processes and terminals
        run: cargo test -p fenix-process -p fenix-execution -p fenix-files -p fenix-skills -p fenix-storage --locked

  ios-portable-base:
    name: Compile portable storage and process policy for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and iOS target
        run: |
          rustup show
          rustup target add aarch64-apple-ios
      - name: Check core modules without claiming application or device validation
        run: cargo check -p fenix-files -p fenix-process -p fenix-execution --target aarch64-apple-ios --locked

  desktop-application:
    name: Check desktop backend and native browser platform helpers
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Compile the backend and tests
        run: cargo check -p fenix-server --tests --locked
      - name: Verify native browser discovery and memory
        run: cargo test -p fenix-browser --lib platform::tests --locked
      - name: Validate PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('scripts/install-windows.ps1', 'packaging/windows/start-fenix.ps1')) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Validate macOS installer syntax
        if: runner.os == 'macOS'
        run: bash -n scripts/install-macos.sh
