name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - name: Install and build frontend
        run: |
          pnpm --dir apps/web install --frozen-lockfile
          pnpm --dir apps/web build
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check public installer contracts
        run: |
          bash -n scripts/install.sh scripts/package-release.sh
          python3 -m unittest discover -s tests/installer -v
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check compiler lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit and HTTP integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Check execution ownership and policy contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cryptography fonts-dejavu-core
          /usr/bin/python3 -m unittest discover -s tests/isolation -v
      - name: Check documentation examples
        run: cargo test --workspace --doc --locked
      - name: Check PDF extraction and OCR routing contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/fenix-pdf-tests"
          "$RUNNER_TEMP/fenix-pdf-tests/bin/pip" install -r resources/skills/pdf-workflows/scripts/requirements.txt
          "$RUNNER_TEMP/fenix-pdf-tests/bin/python" -m unittest discover -s tests/ocr -p test_worker.py -v
          "$RUNNER_TEMP/fenix-pdf-tests/bin/python" -m unittest discover -s tests/pdf -v
      - name: Build the local application
        run: cargo build --locked -p fenix-server
      - name: Check YouTube caption contracts offline
        run: |
          python3 -m venv "$RUNNER_TEMP/fenix-youtube-tests"
          "$RUNNER_TEMP/fenix-youtube-tests/bin/pip" install -r resources/skills/youtube-summary/scripts/requirements.txt
          "$RUNNER_TEMP/fenix-youtube-tests/bin/python" -m unittest discover -s tests/youtube -v
      - name: Check frontend source
        working-directory: apps/web
        run: |
          pnpm run check
          pnpm run format:check
      - name: Install the test browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: apps/web
        run: pnpm test

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.34.5'
      - name: Install and build documentation
        run: |
          pnpm --dir apps/docs install --frozen-lockfile
          pnpm --dir apps/docs build
