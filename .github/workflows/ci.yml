name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check compiler lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit and HTTP integration tests
        run: cargo test --workspace --all-targets --locked
      - name: Check documentation examples
        run: cargo test --workspace --doc --locked
      - name: Build the local application
        run: cargo build --locked -p fenix-server
      - name: Install browser test dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check frontend source
        working-directory: apps/web
        run: |
          npm run check
          npm run format:check
      - name: Install the test browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        working-directory: apps/web
        run: npm test
