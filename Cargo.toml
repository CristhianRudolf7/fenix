[workspace]
members = ["crates/fenix-connectors", "crates/fenix-execution", "crates/fenix-documents", "crates/fenix-core", "crates/fenix-credentials", "crates/fenix-providers", "crates/fenix-storage", "crates/fenix-web", "crates/fenix-browser", "crates/fenix-agent", "apps/server"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/CristhianRudolf7/fenix"

[workspace.dependencies]
fenix-connectors = { path = "crates/fenix-connectors" }
fenix-execution = { path = "crates/fenix-execution" }
fenix-documents = { path = "crates/fenix-documents" }
fenix-core = { path = "crates/fenix-core" }
fenix-credentials = { path = "crates/fenix-credentials" }
fenix-providers = { path = "crates/fenix-providers" }
fenix-storage = { path = "crates/fenix-storage" }
fenix-agent = { path = "crates/fenix-agent" }
fenix-web = { path = "crates/fenix-web" }
fenix-browser = { path = "crates/fenix-browser" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
axum = "0.8"
regex = "1"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "sync", "process", "signal", "fs"] }
toml = "0.8"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
