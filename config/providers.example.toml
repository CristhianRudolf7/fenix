# Native local Ollama needs no key. Enable this only for an authenticated proxy.
# [[credentials]]
# provider = "ollama"
# api_key_env = "OLLAMA_API_KEY"

[[projects]]
id = "demo-project"

[[projects.credentials]]
provider = "openai"
api_key_env = "FENIX_DEMO_OPENAI_API_KEY"
# provider_project = "proj_your_native_project"

[[projects.credentials]]
provider = "deepseek"
api_key_env = "FENIX_DEMO_DEEPSEEK_API_KEY"

# A project's credential can target its own cloud resource.
[[projects.providers]]
provider = "azure"
base_url = "https://your-project-resource.openai.azure.com/openai/v1"

[[projects.credentials]]
provider = "azure"
api_key_env = "FENIX_DEMO_AZURE_API_KEY"
