<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser adversity fixture</title>
<style>
body{font:16px sans-serif;margin:20px}section{margin-bottom:12px}input,textarea,select,button{font:inherit;margin:4px}input{width:180px}input[type=checkbox],input[type=radio]{width:auto}[contenteditable]{border:1px solid;width:300px;min-height:32px}#clip{height:80px;width:250px;overflow:hidden;border:2px solid}#large{height:400px;width:230px;margin:0}#partial{position:relative;width:220px;height:70px}#partial button{position:absolute;inset:0;width:220px;height:70px;margin:0}#cover{position:absolute;left:90px;top:20px;width:40px;height:30px;background:gray}#overlay{position:relative}#overlay span{position:absolute;inset:0;background:gray}#drag{background:lightblue;touch-action:none;width:80px;height:40px}#drop{margin-left:150px;width:120px;height:70px;background:lightgray}#hover span{display:none}#hover:hover span{display:inline}iframe{display:block;border:7px solid;margin:30px 0 0 55px;width:650px;height:340px}#bottom{margin-top:1100px}input:disabled{opacity:.6}
</style>
<section><input id="text" value="old text" aria-label="Text"><input id="email" type="email" value="old@example.test"><input id="number" type="number" value="123"><input id="date" type="date" value="2026-01-01"><input id="time" type="time" value="12:34"><input id="datetime" type="datetime-local" value="2026-01-01T12:34"><input id="month" type="month" value="2026-01"><input id="week" type="week" value="2026-W01"><input id="color" type="color" value="#000000"><input id="range" type="range"><input id="limited" maxlength="4"><input id="readonly" readonly value="unchanged"><fieldset disabled><input id="disabled" value="unchanged"></fieldset><div inert><input id="inert" value="unchanged"></div><input id="password" type="password" value="fixture-secret"><input id="replace" onfocus="this.outerHTML='<input id=replace value=replaced>'"></section>
<section><textarea id="textarea">original</textarea><div id="editor" contenteditable="true"><b>old</b> content</div><div id="not-editor" tabindex="0">Not editable</div></section>
<section><input id="checkbox" type="checkbox"><input id="prevented" type="checkbox" onclick="event.preventDefault()"><input id="radio" type="radio" checked><select id="select"><option value="a">Alpha</option><option value="b">Beta</option><option disabled value="disabled">Disabled</option><optgroup disabled label="Unavailable"><option value="group-disabled">Unavailable</option></optgroup></select><input id="upload" type="file" style="display:none"><output id="file-result"></output></section>
<section><button id="click">Count</button><button id="double">Double</button><button id="delayed">Create delayed input</button><button id="alert">Alert</button><button id="prompt">Prompt</button><button id="spa">SPA route</button><button id="popup">Open popup</button><a id="next" href="/next">Next page</a><a id="download" download="fixture.txt" href="/download">Download</a><div id="hover">Hover <span>tooltip</span></div><span class="duplicate">one</span><span class="duplicate">two</span></section>
<section><div id="partial"><button id="partially-covered">Partial</button><div id="cover"></div></div><div id="overlay"><button id="fully-covered">Covered</button><span></span></div><div id="clip"><button id="large">Large clipped target</button></div><div id="drag" draggable="true">Drag</div><div id="drop">Drop</div></section>
<shadow-host id="shadow"></shadow-host><div id="status">Unrelated success</div><div id="scope">Pending</div><div id="result"></div>
<div id="react-fixture"></div><script src="/react.js"></script>
<iframe id="outer" name="outer" src="/frame?outer"></iframe><iframe id="cross" name="cross" src="http://localhost:PORT/frame?cross"></iframe><button id="bottom">Bottom</button>
<script>
const byId=id=>document.getElementById(id);window.counts={click:0,double:0,partial:0,large:0,drop:0};window.frameMessages=[];
byId('click').onclick=()=>{counts.click++;byId('result').textContent='Clicked '+counts.click};byId('double').ondblclick=()=>counts.double++;
byId('partially-covered').onclick=()=>counts.partial++;byId('large').onclick=()=>counts.large++;
byId('delayed').onclick=()=>setTimeout(()=>{let e=document.createElement('input');e.id='late';byId('scope').append(e)},120);
byId('alert').onclick=()=>alert('Fixture alert');byId('prompt').onclick=()=>{byId('result').textContent=prompt('Fixture prompt')??'cancelled'};
byId('spa').onclick=()=>{history.pushState({},'', '/route');byId('scope').textContent='SPA route'};
byId('popup').onclick=()=>window.open('/next');
byId('upload').onchange=e=>{byId('file-result').textContent=[...e.target.files].map(f=>f.name+':'+f.size).join(',')};
byId('drag').ondragstart=e=>e.dataTransfer.setData('text/plain','payload');byId('drop').ondragover=e=>e.preventDefault();byId('drop').ondrop=e=>{e.preventDefault();counts.drop++;byId('drop').textContent=e.dataTransfer.getData('text/plain')};
byId('shadow').attachShadow({mode:'open'}).innerHTML='<label>Shadow<input id="shadow-input" value="initial"></label><button id="shadow-button"><span>Shadow button</span></button>';
byId('shadow').shadowRoot.querySelector('button').onclick=()=>byId('result').textContent='Shadow clicked';
window.addEventListener('message',e=>{if(e.data?.fixture)frameMessages.push(e.data)});
</script></html>
